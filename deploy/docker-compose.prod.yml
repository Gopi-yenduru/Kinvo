# Production stack for on-prem hospital deployment.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Provide deploy/.env (see deploy/.env.example) and TLS certs in deploy/certs/
# (fullchain.pem + privkey.pem).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:-medintake}
      POSTGRES_USER: ${PGUSER:-medintake}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-medintake}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_CLIENT: postgres
      DATABASE_URL: postgres://${PGUSER:-medintake}:${PGPASSWORD}@db:5432/${PGDATABASE:-medintake}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET (>=32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SARVAM_API_KEY: ${SARVAM_API_KEY:?set SARVAM_API_KEY}
      CORS_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL e.g. https://intake.hospital.local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
