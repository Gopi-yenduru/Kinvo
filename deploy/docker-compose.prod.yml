# Production stack for on-prem hospital deployment.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Provide deploy/.env (see deploy/.env.example) and TLS certs in deploy/certs/
# (fullchain.pem + privkey.pem).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGDATABASE:-medintake}
      POSTGRES_USER: ${PGUSER:-medintake}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-medintake}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_CLIENT: postgres
      DATABASE_URL: postgres://${PGUSER:-medintake}:${PGPASSWORD}@db:5432/${PGDATABASE:-medintake}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET (>=32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SARVAM_API_KEY: ${SARVAM_API_KEY:?set SARVAM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PIPECAT_URL: http://pipecat:8765
      LIVEKIT_URL: http://livekit:8766
      CORS_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL e.g. https://intake.hospital.local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Open-source Pipecat voice pipeline (used when the "Pipecat" voice engine is selected
  # on the Dashboard). Stateless; the backend bridges each session to it over WebSocket.
  pipecat:
    build: ../pipecat-service
    environment:
      PORT: 8765
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
    restart: unless-stopped

  # Open-source LiveKit Agents + Chatterbox-Turbo voice pipeline (used when the
  # "LiveKit Agents + Chatterbox-Turbo" voice engine is selected on the Dashboard).
  # English TTS is served by the separate Chatterbox TTS server (CHATTERBOX_URL).
  livekit:
    build: ../livekit-service
    environment:
      PORT: 8766
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      CHATTERBOX_URL: ${CHATTERBOX_URL:-http://chatterbox:8004}
      CHATTERBOX_MODEL: ${CHATTERBOX_MODEL:-chatterbox-turbo}
      CHATTERBOX_VOICE: ${CHATTERBOX_VOICE:-default}
      INDIC_VOICE_URL: ${INDIC_VOICE_URL:-http://indic-voice:8005}
    restart: unless-stopped

  # Chatterbox-Turbo TTS server — the English voice for the LiveKit engine. Self-hosted from
  # https://github.com/devnen/Chatterbox-TTS-Server (select the "chatterbox-turbo" model).
  # A GPU is strongly recommended; the image tag and GPU passthrough (runtime: nvidia /
  # deploy.resources.devices) are host-specific, so this is left commented. Enable it here,
  # or run Chatterbox on a separate box and set CHATTERBOX_URL in deploy/.env accordingly.
  # chatterbox:
  #   image: ghcr.io/devnen/chatterbox-tts-server:latest
  #   ports:
  #     - "8004:8004"
  #   # NVIDIA GPU example — requires nvidia-container-toolkit on the host:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]
  #   restart: unless-stopped

  # Open Indic STT/TTS (Telugu/Hindi): IndicConformer/IndicWhisper ASR + Indic Parler-TTS.
  # Used when the LiveKit engine's Settings route te/hi to the open Indic models; the livekit
  # service falls back to Sarvam if this isn't up. Heavy models — GPU strongly recommended
  # (switch the Dockerfile base to CUDA + add the gpu `deploy` block below), so left commented.
  # indic-voice:
  #   build: ../indic-voice-service
  #   environment:
  #     PORT: 8005
  #     INDIC_DEVICE: auto
  #   # NVIDIA GPU (requires nvidia-container-toolkit):
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]
  #   restart: unless-stopped

  web:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
