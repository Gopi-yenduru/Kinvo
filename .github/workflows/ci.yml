name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Run tests
        working-directory: backend
        # Tests run against a throwaway SQLite DB (no Docker/Postgres, no secrets).
        run: npm test

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
