<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="color-scheme" content="light dark" />
    <title>Kinvo</title>

    <!-- Apply the saved/system theme before first paint so there is no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kinvo.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>

    <!-- Inter — the fallback for SF Pro on non-Apple systems (Apple devices use the native system font) -->
